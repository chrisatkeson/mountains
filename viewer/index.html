<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sangre de Cristo 1 m DEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #ddd; font: 13px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  #c { display: block; width: 100%; height: 100%; }
  #panel { position: absolute; top: 12px; left: 12px; background: rgba(15,17,22,.85); border: 1px solid #333; border-radius: 8px; padding: 12px 14px; width: 270px; backdrop-filter: blur(6px); }
  #panel h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  #panel label { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; gap: 8px; }
  [hidden] { display: none !important; }
  #panel label > span:first-child { white-space: nowrap; }
  #panel input[type=range] { flex: 1; min-width: 0; }
  #panel select { background: #1b1e25; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 2px 4px; }
  #panel button { background: #1b1e25; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  .pinrow { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
  .pinrow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ddd; }
  .pinrow button { padding: 1px 6px; font-size: 11px; }
  #panel .val { width: 44px; text-align: right; color: #9ab; font-variant-numeric: tabular-nums; }
  #readout { position: absolute; bottom: 12px; left: 12px; background: rgba(15,17,22,.85); border: 1px solid #333; border-radius: 8px; padding: 8px 12px; font-variant-numeric: tabular-nums; min-width: 260px; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; color: #9ab; pointer-events: none; }
  .muted { color: #889; font-size: 12px; margin-bottom: 4px; }
  kbd { background: #222; border: 1px solid #444; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">Loading terrain…</div>
<div id="panel">
  <h1 id="title">Terrain</h1>
  <div class="muted" id="desc" hidden></div>
  <label hidden><span>Exaggeration</span><input id="exag" type="range" min="0.5" max="4" step="0.1" value="1"><span class="val" id="exagv">1.0×</span></label>
  <label hidden><span>Mesh detail</span>
    <select id="detail">
      <option value="8">Low</option>
      <option value="4">Medium</option>
      <option value="2">High</option>
      <option value="1" selected>Full (1 m near camera)</option>
    </select>
  </label>
  <label><span>Texture</span>
    <select id="tex">
      <option value="naip">Aerial imagery (NAIP)</option>
      <option value="color">Hillshade + tint</option>
      <option value="shade">Hillshade only</option>
      <option value="none">Lit surface</option>
    </select>
  </label>
  <label hidden><span>Sun azimuth</span><input id="az" type="range" min="0" max="360" step="1" value="315"><span class="val" id="azv">315°</span></label>
  <label hidden><span>Sun altitude</span><input id="alt" type="range" min="5" max="85" step="1" value="40"><span class="val" id="altv">40°</span></label>
  <label title="Blend steep faces to a slope-lit rock detail texture instead of stretched aerial pixels"><span>Cliff shading</span>
    <select id="cliffs"><option value="0" selected>Off</option><option value="1">On</option></select>
  </label>
  <label><span>Wireframe</span><input id="wire" type="checkbox"></label>
  <button id="exitGround" style="display:none;margin-top:6px">Back to map view (Esc)</button>
  <div hidden><button id="copyLink"></button><span id="copied"></span></div>
  <h1 style="margin-top:14px">Pins</h1>
  <div style="display:flex;gap:6px">
    <input id="pinInput" placeholder="38°01'43.0&quot;N 105°41'00.8&quot;W · 38.0286,-105.6836 · 440009,4209210" style="flex:1;min-width:0;background:#1b1e25;color:#ddd;border:1px solid #444;border-radius:4px;padding:3px 6px">
    <button id="pinAdd">Add</button>
    <button id="pinPlace" title="Click the terrain to drop a pin">Place</button>
  </div>
  <div id="pinList" class="muted" style="margin-top:4px"></div>
  <h1 style="margin-top:14px">Routes</h1>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button id="rtEdit">Start route</button>
    <button id="rtUndo" title="Remove last waypoint">Undo</button>
    <button id="rtClear">Clear</button>
  </div>
  <div class="muted" id="rtHelp" style="margin-top:4px">Start a route, then click the terrain to add waypoints. Drag a waypoint to move it, click one and press Delete to remove it.</div>
  <div id="rtStats" class="muted" style="margin-top:6px"></div>
  <canvas id="rtProfile" width="260" height="70" style="display:block;width:100%;height:70px;margin:4px 0;background:#0b0d10;border-radius:4px"></canvas>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
    <select id="rtList" style="flex:1"><option value="">Saved routes…</option></select>
    <button id="rtSave">Save</button>
    <button id="rtDelete">Delete</button>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
    <button id="rtExport" title="GPX for Gaia GPS, Garmin, etc.">Export GPX</button>
    <button id="rtImportBtn">Import GPX</button><input id="rtImport" type="file" accept=".gpx" hidden>
  </div>
  <div class="muted" id="stats" hidden></div>
</div>
<div id="readout">Hover over the terrain for coordinates.</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

const $ = id => document.getElementById(id);
const status = msg => { const s = $('status'); if (s) s.textContent = msg; };
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); $('readout').textContent = 'WebGL context lost (out of GPU memory?). Reload the page.'; });
const scene = new THREE.Scene();
const SKY = new THREE.Color(0x9fc3ec), DARK = new THREE.Color(0x0b0d10);
scene.background = DARK;
const camera = new THREE.PerspectiveCamera(50, 1, 10, 500000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.01;
controls.zoomToCursor = true;          // wheel zooms toward the terrain under the cursor, not a fixed centre
controls.screenSpacePanning = false;   // right-drag pans parallel to the ground
controls.rotateSpeed = 0.5;
controls.minDistance = 20;

// ---- Data ------------------------------------------------------------------
const meta = await (await fetch('data/meta.json', { cache: 'no-cache' })).json();
const W = meta.width, H = meta.height, cs = meta.cellsize;       // coarse grid, kept on the CPU for picking
const zrange = meta.zmax - meta.zmin, zmid = (meta.zmin + meta.zmax) / 2;
const sizeX = meta.extent_m.x, sizeY = meta.extent_m.y;
document.title = meta.name;
$('title').textContent = meta.name;

status('Loading tile index…');
const index = await (await fetch('data/tiles/index.json', { cache: 'no-cache' })).json();
const T = index.tileSize, TA = T + 2 * index.apron, levels = index.levels, TOP = levels.length - 1;
const base = levels[0].cell;
$('desc').textContent = `${meta.source}, ${meta.tiles.length} tiles. ${(sizeX / 1000).toFixed(0)} × ${(sizeY / 1000).toFixed(0)} km, ` +
  `${meta.zmin.toFixed(0)}–${meta.zmax.toFixed(0)} m. Streaming ${base} m tiles, ${levels.length} levels.` +
  (meta.naip && meta.naip_credit ? ` Imagery: ${meta.naip_credit}.` : '');

status('Loading coarse heightmap…');
// The grid size is part of the URL so a rebuilt heightmap can never be read from a stale cache.
const hbuf = await (await fetch(`data/heightmap.bin?v=${W}x${H}`)).arrayBuffer();
if (hbuf.byteLength !== W * H * 2) {
  status(`heightmap.bin is ${hbuf.byteLength} bytes but meta.json describes ${W}×${H} (${W * H * 2} bytes). Rebuild with process_dem.py or hard-reload.`);
  throw new Error('heightmap size mismatch');
}
const q = new Uint16Array(hbuf);
const z = new Float32Array(q.length);           // coarse elevation in metres, NaN where nodata
for (let i = 0; i < q.length; i++) z[i] = q[i] === 0 ? NaN : meta.zmin + (q[i] - 1) / 65534 * zrange;

// ---- Shaders ---------------------------------------------------------------
// Every tile is drawn with one shared grid geometry whose vertices carry only
// (i, j, skirtFlag). The vertex shader reads elevation from the tile's own
// heightmap texture; the fragment shader derives the normal from neighbouring
// texels (the tile's 1-cell apron makes that exact at the edges).
const decode = `
  float cellHeight(ivec2 c) {
    c = clamp(c, ivec2(0), ivec2(${TA - 1}));
    vec2 t = texelFetch(hmap, c, 0).rg;
    float q = t.r * 255.0 + t.g * 65280.0;
    return tzmin + (max(q, 1.0) - 1.0) / 65534.0 * tzrange;
  }`;
const vert = `
  uniform sampler2D hmap; uniform float tzmin, tzrange, zmid, exag, skirt, cell;
  uniform vec2 extent, origin; uniform vec3 uvXform; uniform vec4 gUv;
  out vec2 vUv; out vec2 vUvTile; out vec2 vCell; out float vValid; out vec3 vWorld;
  ${decode}
  void main() {
    vec2 sTile = (position.xy / ${T}.0) * uvXform.z + uvXform.xy;   // position within the imagery tile, y south
    vUvTile = vec2(sTile.x, 1.0 - sTile.y);
    ivec2 c = ivec2(position.xy) + ${index.apron};
    vec2 t = texelFetch(hmap, c, 0).rg;
    vValid = (t.r * 255.0 + t.g * 65280.0) > 0.5 ? 1.0 : 0.0;
    vec3 p = vec3(origin.x + position.x * cell, (cellHeight(c) - zmid) * exag - position.z * skirt, origin.y + position.y * cell);
    vCell = position.xy; vWorld = p;
    vUv = vec2((p.x - gUv.x) * gUv.z, 1.0 - (p.z - gUv.y) * gUv.w);   // global texture mapped to the area it covers
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  }`;
const frag = `
  uniform sampler2D hmap; uniform sampler2D map; uniform sampler2D rock; uniform bool useMap, tiled, lit, fogOn, cliffs;
  uniform float tzmin, tzrange, cell, exag, sunI, ambI;
  uniform vec3 baseColor, sunDir, fogColor; uniform vec2 fogRange;
  in vec2 vUv; in vec2 vUvTile; in vec2 vCell; in float vValid; in vec3 vWorld;
  out vec4 fragColor;
  ${decode}
  // Repetition-free lookup (I. Quilez): blend two copies of the texture at offsets
  // chosen by low-frequency noise, so no period is visible across a big face.
  float rockNoTile(vec2 uv, float k) {   // k: low-frequency noise shared by the fragment
    vec2 dx = dFdx(uv), dy = dFdy(uv);
    float l = k * 8.0, f = fract(l), ia = floor(l), ib = ia + 1.0;
    vec2 oa = sin(vec2(3.0, 7.0) * ia), ob = sin(vec2(3.0, 7.0) * ib);
    float ca = textureGrad(rock, uv + oa, dx, dy).r, cb = textureGrad(rock, uv + ob, dx, dy).r;
    return mix(ca, cb, smoothstep(0.2, 0.8, f - 0.1 * (ca - cb)));
  }
  // Only the large octave repeats visibly, so only it pays for the anti-repetition
  // lookups; the fine octaves use plain sampling. Planes with tiny weight are skipped.
  float triRockBig(vec3 p, vec3 bw, float k) {   // dominant projection plane only: 2 reads
    if (bw.x >= bw.y && bw.x >= bw.z) return rockNoTile(p.yz, k);
    if (bw.y >= bw.z) return rockNoTile(p.xz, k);
    return rockNoTile(p.xy, k);
  }
  float triRock(vec3 p, vec3 bw) {
    return texture(rock, p.yz).r * bw.x + texture(rock, p.xz).r * bw.y + texture(rock, p.xy).r * bw.z;
  }
  void main() {
    if (vValid < 0.999) discard;
    // Bilinearly interpolated height so the normal varies smoothly within a cell
    // instead of stepping at every cell edge (which showed as pixelated lighting).
    vec2 cf = vCell + float(${index.apron});
    vec2 f = fract(cf); ivec2 c0 = ivec2(floor(cf));
    #define HB(off) mix(mix(cellHeight(c0 + off), cellHeight(c0 + off + ivec2(1, 0)), f.x), mix(cellHeight(c0 + off + ivec2(0, 1)), cellHeight(c0 + off + ivec2(1, 1)), f.x), f.y)
    float dx = (HB(ivec2(1, 0)) - HB(ivec2(-1, 0))) * exag / (2.0 * cell);
    float dz = (HB(ivec2(0, 1)) - HB(ivec2(0, -1))) * exag / (2.0 * cell);
    vec3 n = normalize(vec3(-dx, 1.0, -dz));
    vec2 uv = tiled ? vUvTile : vUv;
    bool inside = tiled || all(greaterThanEqual(uv, vec2(0.0))) && all(lessThanEqual(uv, vec2(1.0)));
    bool haveMap = useMap && inside;
    vec3 col = haveMap ? texture(map, uv).rgb : baseColor;
    // Coarse imagery tiles built before neighbouring area existed hold a flat placeholder
    // grey there; treat it as "no imagery" so the terrain shows lit relief instead.
    if (haveMap && tiled && distance(col, vec3(0.157, 0.173, 0.204)) < 0.03) { haveMap = false; col = baseColor; }
    float light = ambI + sunI * max(dot(n, sunDir), 0.0);
    if (lit || !haveMap) col *= light;      // areas without imagery are always lit so relief still reads
    if (cliffs) {
      // Orthoimagery has no information on near-vertical faces: blend to a triplanar
      // rock detail tinted by the blurred local aerial colour, and re-light by slope.
      // A 1 m grid turns a vertical face into 1 m risers and treads, so the blend,
      // projection and lighting use a normal averaged over +-3 cells; otherwise every
      // step flips between planes and draws a stripe.
      float sx = (cellHeight(c0 + ivec2(3, 0)) - cellHeight(c0 + ivec2(-3, 0))) * exag / (6.0 * cell);   // 4 reads, no bilinear:
      float sz = (cellHeight(c0 + ivec2(0, 3)) - cellHeight(c0 + ivec2(0, -3))) * exag / (6.0 * cell);   // this normal only steers the blend
      vec3 ns = normalize(vec3(-sx, 1.0, -sz));
      float w = 1.0 - smoothstep(0.57, 0.80, ns.y);          // 0 below ~37 deg, 1 above ~55 deg
      if (w > 0.0) {
        float light = ambI + sunI * max(dot(ns, sunDir), 0.0);
        vec3 bw = abs(ns); bw /= bw.x + bw.y + bw.z;
        float k = texture(rock, vWorld.xz * 0.0004 + vWorld.y * 0.0003).r;
        float detail = (triRockBig(vWorld / 29.0, bw, k) * 0.45 + triRock(vWorld / 6.1, bw) * 0.35 + triRock(vWorld / 1.7, bw) * 0.2) / 0.5;
        // Hue from the blurred aerial colour with its baked-in shadow removed, so the face
        // is shaded once, by our sun. Where the photo is too dark to carry a reliable hue
        // (deep shadow has a blue cast that normalisation would blow up), fall back to a
        // neutral rock grey.
        vec3 tint = useMap ? textureLod(map, uv, 5.0).rgb : baseColor;
        float lum = dot(tint, vec3(0.3, 0.59, 0.11));
        vec3 hue = tint / max(lum, 0.02) * 0.42;
        hue = mix(vec3(0.42), hue, 0.6);                               // keep chroma modest even in daylight
        tint = clamp(mix(vec3(0.42), hue, smoothstep(0.06, 0.22, lum)), 0.0, 1.0);
        vec3 rockCol = tint * detail * (light + 0.15);
        col = mix(col, rockCol, w);
      }
    }
    if (fogOn) col = mix(col, fogColor, smoothstep(fogRange.x, fogRange.y, distance(vWorld, cameraPosition)));
    fragColor = vec4(col, 1.0);
  }`;
const loader = new THREE.TextureLoader();
const rockTex = loader.load('data/rock.png', t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.NoColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); });
const U = {   // uniforms shared by every tile material (same objects, so one update reaches all)
  tzmin: { value: index.zmin }, tzrange: { value: index.zrange }, zmid: { value: zmid },
  exag: { value: 1 }, extent: { value: new THREE.Vector2(sizeX, sizeY) },
  lit: { value: true }, cliffs: { value: false }, rock: { value: rockTex },
  gUv: { value: (() => { const nb = meta.naip_bounds || meta.bounds; const x0 = nb.left - meta.bounds.left - sizeX / 2, z0 = meta.bounds.top - nb.top - sizeY / 2;
                          return new THREE.Vector4(x0, z0, 1 / (nb.right - nb.left), 1 / (nb.top - nb.bottom)); })() },
  baseColor: { value: new THREE.Color(0xb8a98a) }, sunDir: { value: new THREE.Vector3(0, 1, 0) },
  sunI: { value: 1.1 }, ambI: { value: 0.35 },
  fogOn: { value: false }, fogColor: { value: SKY.clone() }, fogRange: { value: new THREE.Vector2(15000, 90000) },
};

// Shared tile grid: (T+1)² vertices plus a skirt ring, 32-bit indices.
const grid = (() => {
  const n = T + 1, pos = [], idx = [];
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) pos.push(i, j, 0);
  for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) {
    const a = j * n + i, b = a + 1, c = a + n, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const edges = [[...Array(n)].map((_, i) => i), [...Array(n)].map((_, i) => (n - 1) * n + i),
                 [...Array(n)].map((_, j) => j * n), [...Array(n)].map((_, j) => j * n + n - 1)];
  for (const e of edges) {
    const b0 = pos.length / 3;
    for (const v of e) pos.push(pos[v * 3], pos[v * 3 + 1], 1);
    for (let k = 0; k < n - 1; k++) idx.push(e[k], b0 + k, e[k + 1], e[k + 1], b0 + k, b0 + k + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(new THREE.Uint32BufferAttribute(idx, 1));
  return g;
})();
const trisPerTile = grid.index.count / 3;

// ---- Tile cache and streaming ----------------------------------------------
const cache = new Map();            // key -> { L, tx, ty, state, data, mesh, sphere, lastUsed }
const MAX_TILES = 700, MAX_INFLIGHT = 8;
let inflight = 0, frame = 0;
const keyOf = (L, tx, ty) => `${L}/${tx}_${ty}`;
function tileOrigin(L, tx, ty) {
  const c = levels[L].cell;
  return { x: -sizeX / 2 + tx * T * c, z: -sizeY / 2 + ty * T * c, c };
}
function tileEntry(L, tx, ty) {
  const key = keyOf(L, tx, ty);
  let t = cache.get(key);
  if (t) return t;
  const lv = levels[L];
  const mm = index.minmax[L][ty * lv.nx + tx];
  t = { key, L, tx, ty, state: mm ? 'idle' : 'empty', mm, data: null, mesh: null, sphere: new THREE.Sphere(), lastUsed: 0 };
  cache.set(key, t);
  updateSphere(t);
  return t;
}
function updateSphere(t) {
  if (!t.mm) return;
  const o = tileOrigin(t.L, t.tx, t.ty), e = U.exag.value;
  const half = T * o.c / 2, skirt = 4 * o.c + 10;
  const y = ((t.mm[0] + t.mm[1]) / 2 - zmid) * e, hy = (t.mm[1] - t.mm[0]) / 2 * e + skirt;
  t.sphere.set(new THREE.Vector3(o.x + half, y, o.z + half), Math.hypot(half, hy, half));
}
const DEBUG = new URLSearchParams(location.search).has('debug');
async function load(t) {
  t.state = 'loading'; t.started = performance.now(); inflight++;
  try {
    const r = await fetch(`data/tiles/${t.L}/${t.tx}_${t.ty}.bin.gz?v=${index.built || index.zmin}`);   // rebuilds change the stamp, so stale cached tiles are never reused
    if (!r.ok) throw new Error(r.status);
    const buf = await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    if (buf.byteLength !== TA * TA * 2) throw new Error(`tile is ${buf.byteLength} bytes, expected ${TA * TA * 2}`);
    t.data = new Uint16Array(buf);
    const tex = new THREE.DataTexture(new Uint8Array(buf), TA, TA, THREE.RGFormat, THREE.UnsignedByteType);
    tex.minFilter = tex.magFilter = THREE.NearestFilter;
    tex.generateMipmaps = false; tex.unpackAlignment = 1; tex.needsUpdate = true;
    const o = tileOrigin(t.L, t.tx, t.ty);
    const mat = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: vert, fragmentShader: frag, side: THREE.DoubleSide,
      wireframe: $('wire').checked,
      uniforms: { ...U, hmap: { value: tex }, origin: { value: new THREE.Vector2(o.x, o.z) }, cell: { value: o.c }, skirt: { value: 4 * o.c + 10 },
                  map: { value: null }, useMap: { value: false }, tiled: { value: false }, uvXform: { value: new THREE.Vector3(0, 0, 1) } } });
    t.mesh = new THREE.Mesh(grid, mat);
    t.mesh.frustumCulled = false; t.mesh.visible = false;
    scene.add(t.mesh);
    t.state = 'ready';
  } catch (err) {
    console.warn('tile failed', t.key, err); t.state = 'idle';
  } finally { inflight--; }
}
function evict(t) {
  if (t.mesh) { scene.remove(t.mesh); t.mesh.material.uniforms.hmap.value.dispose(); t.mesh.material.dispose(); }
  cache.delete(t.key);
}

// ---- Imagery tiles (same layout as terrain tiles, 1024 px each) -------------
const imgCache = new Map();          // key -> { state: idle|loading|ready|missing, tex, lastUsed }
const MAX_IMG = 300, MAX_IMG_INFLIGHT = 6;
let imgInflight = 0, imgWanted = [], texMode = 'naip';
const imgLoader = new THREE.TextureLoader();
function imgEntry(key) {
  let e = imgCache.get(key);
  if (!e) { e = { key, state: 'idle', tex: null, lastUsed: 0 }; imgCache.set(key, e); }
  return e;
}
function loadImg(e) {
  e.state = 'loading'; imgInflight++;
  const [L, rest] = e.key.split('/'), [tx, ty] = rest.split('_');
  imgLoader.load(`data/imagery/${L}/${tx}_${ty}.jpg`, tex => {
    tex.colorSpace = THREE.NoColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    e.tex = tex; e.state = 'ready'; imgInflight--;
  }, undefined, () => { e.state = 'missing'; imgInflight--; });
}
// Pick the imagery for a terrain tile: its own tile, else the nearest loaded ancestor.
function assignTexture(t, d) {
  const u = t.mesh.material.uniforms;
  if (texMode === 'none') { u.useMap.value = false; return; }
  if (texMode !== 'naip') { u.useMap.value = !!texCache[texMode]; u.map.value = texCache[texMode] || null; u.tiled.value = false; return; }

  const pole = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 3.2, 0)]), poleMat); g.add(pole);
  g.position.set(w.x, y, w.z); pinGroup.add(g);
  pins.push({ E, N, name: name || `Pin ${pins.length + 1}`, mesh: g });
  renderPins(); syncUrl();
}
function pinUrl(p) {

  q.set('view', `${(p.E - 1100).toFixed(0)},${(p.N - 1100).toFixed(0)},${(sampleZ(...Object.values(toWorld(p.E, p.N))) + 700).toFixed(0)},${p.E.toFixed(0)},${p.N.toFixed(0)}`);
  q.delete('ground'); q.delete('yaw'); q.delete('pitch'); q.delete('fov');
  q.set('pins', pins.map(x => `${x.E.toFixed(0)},${x.N.toFixed(0)},${encodeURIComponent(x.name)}`).join(';'));
  return location.origin + location.pathname + '?' + q.toString();
}
function goToPin(p) {
  if (ground.active) exitGround();
  const w = toWorld(p.E, p.N), y = surfaceY(w.x, w.z);
  controls.target.set(w.x, y, w.z); camera.position.set(w.x - 1100, y + 700, w.z + 1100); controls.update(); syncUrl();
}
function renderPins() {
  const el = $('pinList'); el.innerHTML = '';
  pins.forEach((p, i) => {
    const w = toWorld(p.E, p.N), [la, lo] = utmToLatLon(p.E, p.N);
    const row = document.createElement('div'); row.className = 'pinrow';
    row.innerHTML = `<span title="${la.toFixed(6)}, ${lo.toFixed(6)} · E ${p.E.toFixed(0)} N ${p.N.toFixed(0)}">${p.name} · ${(surfaceY(w.x, w.z) + zmid).toFixed(0)} m</span>` +
      `<button data-a="go">Go</button><button data-a="link">Link</button><button data-a="rm" title="Remove">×</button>`;
    row.querySelector('[data-a=go]').onclick = () => goToPin(p);
    row.querySelector('[data-a=link]').onclick = async b => { const u = pinUrl(p); try { await navigator.clipboard.writeText(u); b.target.textContent = 'Copied'; } catch { prompt('Pin link', u); } setTimeout(() => { b.target.textContent = 'Link'; }, 1500); };
    row.querySelector('[data-a=rm]').onclick = () => { pinGroup.remove(p.mesh); pins.splice(i, 1); renderPins(); syncUrl(); };
    el.appendChild(row);
  });
}
$('pinAdd').onclick = () => {
  const c = parseCoord($('pinInput').value);
  if (!c) { $('pinInput').style.borderColor = '#e55'; setTimeout(() => $('pinInput').style.borderColor = '#444', 1200); return; }
  const w = toWorld(...c);
  if (Number.isNaN(sampleZ(w.x, w.z))) { alert('That point is outside the terrain.'); return; }
  addPin(c[0], c[1]); $('pinInput').value = ''; goToPin(pins[pins.length - 1]);
};
$('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('pinAdd').click(); });
$('pinPlace').onclick = () => { placingPin = !placingPin; $('pinPlace').textContent = placingPin ? 'Click terrain…' : 'Place'; };
function pinPointerUp(ev, wasClick) {
  if (!placingPin || !wasClick) return false;
  const hit = pickTerrain(ev.clientX, ev.clientY);
  if (hit) { const u = toUTM(hit); addPin(u.E, u.N); }
  placingPin = false; $('pinPlace').textContent = 'Place';
  return true;
}
function pinFrame() {
  const focal = innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  for (const p of pins) {
    const d = camera.position.distanceTo(p.mesh.position), sc = Math.max(0.5, d * 9 / focal);
    p.mesh.scale.setScalar(sc);                            // pole base sits on the ground, head above
    p.mesh.position.y = surfaceY(p.mesh.position.x, p.mesh.position.z);
  }
}

// ---- Route planning ---------------------------------------------------------
// Waypoints live in UTM metres (E, N). The drawn line is draped on the heightfield,
// coloured by slope, and the stats come from the draped profile. Routes persist in
// localStorage and round-trip through GPX (WGS84) for Gaia GPS / GPS devices.
const route = { pts: [], edit: false, sel: -1, drag: null, name: '' };
const rtGroup = new THREE.Group(); scene.add(rtGroup);
const rtMat = new LineMaterial({ vertexColors: true, linewidth: 4, worldUnits: false, depthTest: true });
rtMat.resolution.set(innerWidth, innerHeight);
let rtLine = null;
const wpGeo = new THREE.SphereGeometry(1, 12, 8);
const wpMatN = new THREE.MeshBasicMaterial({ color: 0xffffff }), wpMatS = new THREE.MeshBasicMaterial({ color: 0xff9f1c });
const markers = [];

// Drape each segment at ~2 m spacing; returns [{x, y(world), z, d(dist m), ele}]
let draped = [];
function drape() {
  draped = [];
  let d = 0, prev = null;
  for (let i = 0; i < route.pts.length; i++) {
    const a = toWorld(...route.pts[i]);
    if (prev) {
      const len = Math.hypot(a.x - prev.x, a.z - prev.z), n = Math.max(1, Math.ceil(len / 2));
      for (let k = 1; k <= n; k++) {
        const x = prev.x + (a.x - prev.x) * k / n, zz = prev.z + (a.z - prev.z) * k / n;
        const y = surfaceY(x, zz), last = draped[draped.length - 1];
        d += Math.hypot(x - last.x, zz - last.z, y - last.y);
        draped.push({ x, y, z: zz, d, ele: y + zmid });
      }
    } else draped.push({ x: a.x, y: surfaceY(a.x, a.z), z: a.z, d: 0, ele: surfaceY(a.x, a.z) + zmid });
    prev = a;
  }
}
function slopeColor(deg, out) {   // green -> yellow -> red -> magenta
  const t = Math.min(deg / 45, 1);
  const c = t < 0.5 ? new THREE.Color().setHSL(0.33 - t * 0.5, 0.9, 0.5) : new THREE.Color().setHSL(0.08 - (t - 0.5) * 0.3, 0.9, 0.5);
  if (deg > 45) c.setHSL(0.85, 0.9, 0.55);
  out.push(c.r, c.g, c.b);
}
function rebuildRoute() {
  drape();
  if (rtLine) { rtGroup.remove(rtLine); rtLine.geometry.dispose(); rtLine = null; }
  for (const m of markers) rtGroup.remove(m);
  markers.length = 0;
  if (draped.length >= 2) {
    const pos = [], col = [];
    for (let i = 0; i < draped.length; i++) {
      const p = draped[i]; pos.push(p.x, p.y + 2, p.z);
      const q = draped[Math.max(0, i - 1)], r = draped[Math.min(draped.length - 1, i + 1)];
      const run = Math.hypot(r.x - q.x, r.z - q.z), deg = run > 0 ? Math.atan(Math.abs(r.y - q.y) / run) * 180 / Math.PI : 0;
      slopeColor(deg, col);
    }
    const g = new LineGeometry(); g.setPositions(pos); g.setColors(col);
    rtLine = new Line2(g, rtMat); rtLine.computeLineDistances(); rtLine.frustumCulled = false;
    rtGroup.add(rtLine);
  }
  route.pts.forEach((p, i) => {
    const w = toWorld(...p), m = new THREE.Mesh(wpGeo, i === route.sel ? wpMatS : wpMatN);
    m.position.set(w.x, surfaceY(w.x, w.z) + 2, w.z); m.userData.i = i; rtGroup.add(m); markers.push(m);
  });
  updateRouteStats();
}
function updateRouteStats() {
  const el = $('rtStats'), cv = $('rtProfile'), ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (draped.length < 2) { el.textContent = route.pts.length ? '1 waypoint' : 'No route.'; return; }
  // Gain/loss with 3 m hysteresis so 1 m lidar noise doesn't inflate the totals.
  let gain = 0, loss = 0, ref = draped[0].ele, maxSlope = 0;
  for (const p of draped) {
    if (p.ele > ref + 3) { gain += p.ele - ref; ref = p.ele; } else if (p.ele < ref - 3) { loss += ref - p.ele; ref = p.ele; }
  }
  for (let i = 10; i < draped.length; i++) {   // steepest 20 m stretch
    const a = draped[i - 10], b = draped[i], run = Math.hypot(b.x - a.x, b.z - a.z);
    if (run > 1) maxSlope = Math.max(maxSlope, Math.atan(Math.abs(b.ele - a.ele) / run) * 180 / Math.PI);
  }
  const total = draped[draped.length - 1].d;
  el.innerHTML = `${(total / 1000).toFixed(2)} km (${(total / 1609.34).toFixed(2)} mi) · ↑ ${gain.toFixed(0)} m (${(gain * 3.281).toFixed(0)} ft) · ↓ ${loss.toFixed(0)} m · steepest 20 m: ${maxSlope.toFixed(0)}°` +
    ` · ${route.pts.length} waypoints` + (route.name ? ` · <b>${route.name}</b>` : '');
  // Profile
  const W_ = cv.width, H_ = cv.height, lo = Math.min(...draped.map(p => p.ele)), hi = Math.max(...draped.map(p => p.ele)), rng = Math.max(hi - lo, 20);
  for (let i = 1; i < draped.length; i++) {
    const a = draped[i - 1], b = draped[i], run = Math.hypot(b.x - a.x, b.z - a.z);
    const deg = run > 0 ? Math.atan(Math.abs(b.ele - a.ele) / run) * 180 / Math.PI : 0, c = []; slopeColor(deg, c);
    ctx.strokeStyle = `rgb(${c[0] * 255},${c[1] * 255},${c[2] * 255})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(a.d / total * W_, H_ - 4 - (a.ele - lo) / rng * (H_ - 10)); ctx.lineTo(b.d / total * W_, H_ - 4 - (b.ele - lo) / rng * (H_ - 10)); ctx.stroke();
  }
  ctx.fillStyle = '#9ab'; ctx.font = '10px system-ui'; ctx.fillText(`${hi.toFixed(0)} m`, 2, 10); ctx.fillText(`${lo.toFixed(0)} m`, 2, H_ - 1);
}
function setEdit(on) {
  route.edit = on; $('rtEdit').textContent = on ? 'Done' : (route.pts.length ? 'Edit route' : 'Start route');
  $('rtHelp').style.display = on ? '' : 'none';
  if (!on) { route.sel = -1; rebuildRoute(); }
}
$('rtEdit').onclick = () => setEdit(!route.edit);
$('rtUndo').onclick = () => { route.pts.pop(); route.sel = -1; rebuildRoute(); };
$('rtClear').onclick = () => { route.pts = []; route.sel = -1; route.name = ''; rebuildRoute(); };
setEdit(false);

// Waypoint picking (markers only; the terrain itself uses the heightfield march)
const wpRay = new THREE.Raycaster();
function pickMarker(clientX, clientY) {
  ndc.set(clientX / innerWidth * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  wpRay.setFromCamera(ndc, camera); wpRay.params.Mesh = {};
  const hit = wpRay.intersectObjects(markers, false)[0];
  return hit ? hit.object.userData.i : -1;
}
function routePointerDown(ev) {   // returns true if the event was consumed
  if (!route.edit || ground.active || ev.button !== 0) return false;
  const i = pickMarker(ev.clientX, ev.clientY);
  if (i < 0) return false;
  route.sel = i; route.drag = i; controls.enabled = false; rebuildRoute();
  return true;
}
function routePointerMove(ev) {
  if (route.drag === null) return false;
  const hit = pickTerrain(ev.clientX, ev.clientY);
  if (hit) { const u = toUTM(hit); route.pts[route.drag] = [u.E, u.N]; rebuildRoute(); }
  return true;
}
function routePointerUp(ev, wasClick) {
  if (route.drag !== null) { route.drag = null; controls.enabled = !ground.active; return true; }
  if (!route.edit || ground.active || !wasClick) return false;
  const hit = pickTerrain(ev.clientX, ev.clientY);
  if (!hit) return true;
  const u = toUTM(hit); route.pts.push([u.E, u.N]); route.sel = -1; rebuildRoute();
  return true;
}
addEventListener('keydown', e => {
  if (route.edit && route.sel >= 0 && (e.key === 'Delete' || e.key === 'Backspace') && document.activeElement.tagName !== 'INPUT') {
    route.pts.splice(route.sel, 1); route.sel = -1; rebuildRoute(); e.preventDefault();
  }
});
// Keep markers a constant screen size and re-drape as finer tiles arrive.
let drapeTick = 0;
function routeFrame() {
  const focal = innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  for (const m of markers) { const d = camera.position.distanceTo(m.position); m.scale.setScalar(Math.max(0.5, d * 7 / focal)); }
  if (route.pts.length > 1 && ++drapeTick % 90 === 0) rebuildRoute();
}

// ---- Saved routes ----
const store = () => JSON.parse(localStorage.getItem('routes') || '{}');
function refreshList() {
  const sel = $('rtList'), names = Object.keys(store()).sort();
  sel.innerHTML = '<option value="">Saved routes…</option>' + names.map(n => `<option value="${n.replace(/"/g, '&quot;')}">${n}</option>`).join('');
  sel.value = route.name && names.includes(route.name) ? route.name : '';
}
$('rtSave').onclick = () => {
  if (route.pts.length < 2) return;
  const name = prompt('Route name', route.name || 'Route ' + (Object.keys(store()).length + 1));
  if (!name) return;
  const all = store(); all[name] = { pts: route.pts, saved: new Date().toISOString() };
  localStorage.setItem('routes', JSON.stringify(all)); route.name = name; refreshList(); updateRouteStats(); syncUrl();
};
$('rtDelete').onclick = () => {
  const name = $('rtList').value; if (!name || !confirm(`Delete "${name}"?`)) return;
  const all = store(); delete all[name]; localStorage.setItem('routes', JSON.stringify(all));
  if (route.name === name) route.name = ''; refreshList(); updateRouteStats(); syncUrl();
};
$('rtList').onchange = () => { const r = store()[$('rtList').value]; if (r) { route.pts = r.pts.map(p => [...p]); route.name = $('rtList').value; route.sel = -1; setEdit(false); syncUrl(); } };
refreshList();

// ---- GPX (WGS84) <-> UTM zone 13N on GRS80; the NAD83/WGS84 difference is ~1 m here ----
const UTM = { a: 6378137, f: 1 / 298.257222101, k0: 0.9996, lon0: -105, fe: 500000 };
function utmToLatLon(E, N) {
  const { a, f, k0, lon0, fe } = UTM, e2 = f * (2 - f), ep2 = e2 / (1 - e2), e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  const M = N / k0, mu = M / (a * (1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 ** 3 / 256));
  const phi1 = mu + (3 * e1 / 2 - 27 * e1 ** 3 / 32) * Math.sin(2 * mu) + (21 * e1 * e1 / 16 - 55 * e1 ** 4 / 32) * Math.sin(4 * mu) + (151 * e1 ** 3 / 96) * Math.sin(6 * mu);
  const sp = Math.sin(phi1), cp = Math.cos(phi1), tp = Math.tan(phi1);
  const N1 = a / Math.sqrt(1 - e2 * sp * sp), T1 = tp * tp, C1 = ep2 * cp * cp, R1 = a * (1 - e2) / (1 - e2 * sp * sp) ** 1.5, D = (E - fe) / (N1 * k0);
  const lat = phi1 - (N1 * tp / R1) * (D * D / 2 - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * D ** 4 / 24 + (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * ep2 - 3 * C1 * C1) * D ** 6 / 720);
  const lon = lon0 * Math.PI / 180 + (D - (1 + 2 * T1 + C1) * D ** 3 / 6 + (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) * D ** 5 / 120) / cp;
  return [lat * 180 / Math.PI, lon * 180 / Math.PI];
}
function latLonToUtm(lat, lon) {
  const { a, f, k0, lon0, fe } = UTM, e2 = f * (2 - f), ep2 = e2 / (1 - e2), phi = lat * Math.PI / 180, dl = (lon - lon0) * Math.PI / 180;
  const sp = Math.sin(phi), cp = Math.cos(phi), tp = Math.tan(phi), Nn = a / Math.sqrt(1 - e2 * sp * sp), T = tp * tp, C = ep2 * cp * cp, A = cp * dl;
  const M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 ** 3 / 256) * phi - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * phi) + (15 * e2 * e2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * phi) - (35 * e2 ** 3 / 3072) * Math.sin(6 * phi));
  const E = fe + k0 * Nn * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120);
  const N = k0 * (M + Nn * tp * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
  return [E, N];
}
$('rtExport').onclick = () => {
  if (draped.length < 2) return;
  const name = route.name || 'route', esc = t => t.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
  let g = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="mountains viewer" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><name>${esc(name)}</name><time>${new Date().toISOString()}</time></metadata>\n`;
  route.pts.forEach((p, i) => { const [la, lo] = utmToLatLon(...p), w = toWorld(...p); g += `<wpt lat="${la.toFixed(7)}" lon="${lo.toFixed(7)}"><ele>${(surfaceY(w.x, w.z) + zmid).toFixed(1)}</ele><name>WP${i + 1}</name></wpt>\n`; });
  g += `<trk><name>${esc(name)}</name><trkseg>\n`;
  for (let i = 0; i < draped.length; i += 5) { const u = toUTM(draped[i]), [la, lo] = utmToLatLon(u.E, u.N); g += `<trkpt lat="${la.toFixed(7)}" lon="${lo.toFixed(7)}"><ele>${draped[i].ele.toFixed(1)}</ele></trkpt>\n`; }
  g += `</trkseg></trk>\n</gpx>\n`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([g], { type: 'application/gpx+xml' })); a.download = name.replace(/[^\w.-]+/g, '_') + '.gpx'; a.click();
};
$('rtImportBtn').onclick = () => $('rtImport').click();
$('rtImport').onchange = async () => {
  const f = $('rtImport').files[0]; if (!f) return;
  const doc = new DOMParser().parseFromString(await f.text(), 'application/xml');
  let pts = [...doc.querySelectorAll('rtept')]; if (pts.length < 2) pts = [...doc.querySelectorAll('trkpt')]; if (pts.length < 2) pts = [...doc.querySelectorAll('wpt')];
  if (pts.length < 2) { alert('No route, track, or waypoints found in that GPX.'); return; }
  const step = Math.max(1, Math.floor(pts.length / 150));   // keep the route editable
  const sel = pts.filter((_, i) => i % step === 0 || i === pts.length - 1);
  route.pts = sel.map(p => latLonToUtm(parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon'))));
  route.name = (doc.querySelector('trk > name, rte > name, metadata > name')?.textContent || f.name.replace(/\.gpx$/i, '')).trim();
  route.sel = -1; setEdit(false); $('rtImport').value = '';
  const w = toWorld(...route.pts[0]); controls.target.set(w.x, surfaceY(w.x, w.z), w.z); camera.position.set(w.x - 3000, surfaceY(w.x, w.z) + 2500, w.z + 3000); controls.update();
};
{
  const qs = new URLSearchParams(location.search), r = qs.get('route'), pts = qs.get('pts');
  if (qs.get('pins')) for (const t of qs.get('pins').split(';')) { const [E, N, name] = t.split(','); if (Number.isFinite(+E) && Number.isFinite(+N)) addPin(+E, +N, name ? decodeURIComponent(name) : ''); }
  if (r && store()[r]) { route.pts = store()[r].pts.map(p => [...p]); route.name = r; refreshList(); rebuildRoute(); }
  else if (pts) { route.pts = pts.split(';').map(t => t.split(',').map(Number)).filter(p => p.length === 2 && p.every(Number.isFinite)); rebuildRoute(); }
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  rtMat.resolution.set(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
$('status').remove();
renderer.setAnimationLoop(() => {
  walk(); routeFrame(); pinFrame();
  if (!ground.active) controls.update();
  camera.updateMatrixWorld();
  updateLOD();
  renderer.render(scene, camera);
});
</script>
</body>
